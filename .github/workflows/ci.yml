name: ci

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved files are byte-identical
        run: sha256sum -c MANIFEST.sha256

  factor:
    runs-on: ubuntu-latest
    env:
      FACTOR_VERSION: "0.102"
      FACTOR_SHA256: 567239b0b5fe4222d26bb871ad4c6b6f00f7dc885e149191d4fef7197e280551
    steps:
      - uses: actions/checkout@v4
      - name: Install Factor
        run: |
          curl -fsSL -o factor.tar.gz \
            "https://downloads.factorcode.org/releases/${FACTOR_VERSION}/factor-linux-x86-64-${FACTOR_VERSION}.tar.gz"
          echo "${FACTOR_SHA256}  factor.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/factor-dist"
          tar xzf factor.tar.gz -C "$RUNNER_TEMP/factor-dist"
          echo "FACTOR_BIN=$RUNNER_TEMP/factor-dist/factor/factor" >> "$GITHUB_ENV"
      - name: Require Factor
        run: test -x "$FACTOR_BIN" || { echo "missing factor"; exit 1; }
      - name: Engine unit tests (fails on any failing test)
        run: ./scripts/run-unit-tests-strict.sh
      - name: Research conformance tests
        run: ./scripts/run-research-tests.sh
      - name: Research conformance report
        run: ./scripts/run-research-report.sh "$RUNNER_TEMP/research-claims.json"
      - name: Benchmark harness
        run: ./scripts/run-bench-repo.sh "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: factor-results
          path: |
            ${{ runner.temp }}/research-claims.json
            ${{ runner.temp }}/results.json

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Require Lean
        run: |
          command -v lean >/dev/null 2>&1 || { echo "missing lean"; exit 1; }
          command -v lake >/dev/null 2>&1 || { echo "missing lake"; exit 1; }
      - name: Build original Lean proofs
        run: cd lean && lake build
      - name: Build research conformance proofs
        run: cd tests/lean && lake build

  array:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build CBQN
        run: |
          git clone --depth 1 https://github.com/dzaima/CBQN "$RUNNER_TEMP/CBQN"
          make -C "$RUNNER_TEMP/CBQN" -j"$(nproc)" REPLXX=0
          install -m 755 "$RUNNER_TEMP/CBQN/BQN" /usr/local/bin/BQN
          command -v BQN >/dev/null 2>&1 || { echo "missing BQN"; exit 1; }
      - name: Install J
        run: |
          curl -fsSL -o "$RUNNER_TEMP/j9.tar.gz" \
            "https://www.jsoftware.com/download/j9.6/install/j9.6_linux64.tar.gz"
          mkdir -p "$RUNNER_TEMP/jdist"
          tar xzf "$RUNNER_TEMP/j9.tar.gz" -C "$RUNNER_TEMP/jdist"
          jbin="$(find "$RUNNER_TEMP/jdist" -type f -name jconsole | head -n 1)"
          if [ -z "$jbin" ]; then
            echo "missing jconsole"
            exit 1
          fi
          echo "$(dirname "$jbin")" >> "$GITHUB_PATH"
          export PATH="$(dirname "$jbin"):$PATH"
          command -v jconsole >/dev/null 2>&1 || { echo "missing jconsole"; exit 1; }
      - name: Run BQN and J programs
        run: ./scripts/run-array-langs.sh
